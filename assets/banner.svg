<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a11"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(31, 41, 55, 0.7)"/>
      <stop offset="100%" stop-color="rgba(17, 24, 39, 0.8)"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
    .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 18px; fill: #9ca3af; }
    .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #e0e7ff; }
    .card-title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 14px; fill: #38bdf8; }
    .card-val { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 12px; fill: #94a3b8; }

    /* Keyframe Animations */
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }

    @keyframes float-node {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    @keyframes dash-flow {
      to { stroke-dashoffset: -40; }
    }

    @keyframes radar-sweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .pulsing-orb { animation: pulse-glow 6s infinite ease-in-out; transform-origin: center; }
    .floating-card-1 { animation: float-node 5s infinite ease-in-out; }
    .floating-card-2 { animation: float-node 7s infinite ease-in-out 1s; }
    .floating-card-3 { animation: float-node 6s infinite ease-in-out 2s; }
    .data-stream { stroke-dasharray: 8 8; animation: dash-flow 2s linear infinite; }
    .radar-line { transform-origin: 980px 200px; animation: radar-sweep 10s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/>

  <!-- Dynamic Glowing Background Orbs -->
  <circle cx="200" cy="100" r="180" fill="#3b82f6" opacity="0.15" class="pulsing-orb" filter="url(#glow)" />
  <circle cx="1000" cy="280" r="220" fill="#8b5cf6" opacity="0.15" class="pulsing-orb" filter="url(#glow)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M 0 50 H 1200 M 0 100 H 1200 M 0 150 H 1200 M 0 200 H 1200 M 0 250 H 1200 M 0 300 H 1200 M 0 350 H 1200" />
    <path d="M 100 0 V 400 M 200 0 V 400 M 300 0 V 400 M 400 0 V 400 M 500 0 V 400 M 600 0 V 400 M 700 0 V 400 M 800 0 V 400 M 900 0 V 400 M 1000 0 V 400 M 1100 0 V 400" />
  </g>

  <!-- Network / Migration Flow Lines (Background Dynamic Element) -->
  <g stroke="url(#accent-cyan)" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 750 280 C 820 280, 850 150, 920 150" class="data-stream" />
    <path d="M 780 120 C 850 120, 880 250, 960 250" class="data-stream" />
    <path d="M 920 150 L 1050 120" class="data-stream" />
  </g>

  <!-- Radar / Discovery Graphic (Right Side Background) -->
  <g transform="translate(980, 200)">
    <circle r="130" stroke="#334155" stroke-width="1.5" fill="none" opacity="0.5"/>
    <circle r="90" stroke="#334155" stroke-width="1.5" fill="none" opacity="0.5"/>
    <circle r="50" stroke="#334155" stroke-width="1.5" fill="none" opacity="0.5"/>
    <line x1="-140" y1="0" x2="140" y2="0" stroke="#334155" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="-140" x2="0" y2="140" stroke="#334155" stroke-width="1" opacity="0.3"/>
    <!-- Radar Sweep Line -->
    <line x1="0" y1="0" x2="120" y2="-50" stroke="#06b6d4" stroke-width="2" class="radar-line" opacity="0.8" filter="url(#glow)"/>
  </g>

  <!-- Animated Interactive Data Nodes / Floating Cards (Dynamic Aspect) -->
  <g class="floating-card-1" filter="url(#soft-shadow)">
    <rect x="730" y="80" width="170" height="65" rx="10" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
    <text x="745" y="105" class="card-title">🔍 Agentless Scan</text>
    <text x="745" y="128" class="card-val">VMware &amp; Physical</text>
  </g>

  <g class="floating-card-2" filter="url(#soft-shadow)">
    <rect x="940" y="240" width="180" height="65" rx="10" fill="url(#card-grad)" stroke="#a855f7" stroke-width="1.5" opacity="0.9"/>
    <text x="955" y="265" class="card-title" fill="#c084fc">🗺️ Wave Planning</text>
    <text x="955" y="288" class="card-val">7Rs Strategy Matrix</text>
  </g>

  <g class="floating-card-3" filter="url(#soft-shadow)">
    <rect x="760" y="250" width="165" height="65" rx="10" fill="url(#card-grad)" stroke="#3b82f6" stroke-width="1.5" opacity="0.9"/>
    <text x="775" y="275" class="card-title" fill="#60a5fa">💰 TCO Optimization</text>
    <text x="775" y="298" class="card-val">AWS / Azure / GCP</text>
  </g>

  <!-- Foreground Title and Content Section (Guaranteed Clear Foreground Visibility) -->
  <g transform="translate(70, 0)">
    <!-- Top Pill / Badge -->
    <g transform="translate(0, 75)">
      <rect width="260" height="32" rx="16" fill="url(#accent-cyan)" opacity="0.2"/>
      <rect width="260" height="32" rx="16" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
      <text x="16" y="21" class="badge-text">⚡ Enterprise Migration &amp; Discovery</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="165" class="title">Awesome Cloud Migration</text>
    <text x="0" y="215" class="title" fill="url(#accent-cyan)">Discovery &amp; Planning 🗺️ ☁️</text>

    <!-- Subtitle -->
    <text x="0" y="260" class="subtitle">Curated Directory of Assessment Platforms, Dependency Mapping &amp; 7Rs Engines</text>

    <!-- Stat Badges / Quick Highlights -->
    <g transform="translate(0, 295)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="140" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="12" y="19" font-family="Segoe UI, sans-serif" font-size="12" fill="#38bdf8" font-weight="600">🏢 SaaS &amp; Hyperscalers</text>

      <!-- Badge 2 -->
      <rect x="150" y="0" width="135" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="162" y="19" font-family="Segoe UI, sans-serif" font-size="12" fill="#a855f7" font-weight="600">🔓 Open-Source Tools</text>

      <!-- Badge 3 -->
      <rect x="295" y="0" width="125" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="307" y="19" font-family="Segoe UI, sans-serif" font-size="12" fill="#4ade80" font-weight="600">📊 TCO &amp; 7Rs Matrix</text>
    </g>
  </g>
</svg>
